name: 功能建议 (Feature Request)
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 简洁描述当前流程中让你不便或受限的地方
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望增加或改进什么能力
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否考虑过其他实现方式
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: 补充说明
    validations:
      required: false
