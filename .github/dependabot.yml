version: 2
updates:
  # Cargo.lock 与 package-lock.json 都是「单文件锁」：同一生态里任意两个 Dependabot PR
  # 都会争抢同一个文件、互相顶掉，且 tauri / tauri-build / tauri-plugin-* 必须同版本联动，
  # 单独升级 tauri 而留着旧 tauri-build 会直接构建失败（2026-09-30 的 PR #21 即因此红灯）。
  # 因此每个生态只开一个聚合 PR：一次提交、一次 CI、一次合并。
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(npm)"
    # 仅自动收 minor/patch；屏蔽 major 升级，避免把 React 18 / TS 5 项目误推到 19 / 7
    ignore:
      - update-types: ["version-update:semver-major"]
    groups:
      all:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(cargo)"
    ignore:
      - update-types: ["version-update:semver-major"]
    groups:
      all:
        patterns:
          - "*"
