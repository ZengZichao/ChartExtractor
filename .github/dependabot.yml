version: 2
updates:
  # Cargo.lock 与 package-lock.json 都是「单文件锁」：同一生态里任意两个 Dependabot PR
  # 都会争抢同一个文件、互相顶掉，且 tauri / tauri-build / tauri-plugin-* 必须同版本联动，
  # 单独升级 tauri 而留着旧 tauri-build 会直接构建失败（2026-09-30 的 PR #21 即因此红灯）。
  # 因此每个生态只开一个聚合 PR：一次提交、一次 CI、一次合并。
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(npm)"
    # 仅自动收 minor/patch；屏蔽 major 升级，避免把 React 18 / TS 5 项目误推到 19 / 7
    ignore:
      - update-types: ["version-update:semver-major"]
    groups:
      all:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(cargo)"
    ignore:
      - update-types: ["version-update:semver-major"]
      # glib 的安全告警（GHSA-wrw7-89jp-8q8g，VariantStrIter 迭代器 soundness，
      # 影响范围 >=0.15、<0.20）要求 0.20.0，但 tauri 2.x 依赖 gtk-rs 0.18，
      # Cargo.lock 只能锁在 0.18.5——Dependabot 每轮都报 security_update_not_possible，
      # Actions 页面因此常红。该告警已在仓库设置里按 tolerable_risk dismiss：
      # 相关代码只存在于 Linux GTK 依赖链上，macOS 产物并不编译。tauri 迁移到
      # gtk-rs 0.20 后应移除本条并重新评估。
      - dependency-name: "glib"
    groups:
      all:
        patterns:
          - "*"

  # GitHub Actions 此前完全没有升级通道：ci.yml / release.yml 里用到的
  # actions/checkout、actions/setup-node、actions/cache、softprops/action-gh-release
  # 以及 dtolnay/rust-toolchain 都只会在本地腐化，不会有人收到提醒。
  #
  # 这里刻意「不」屏蔽 semver-major，与上面两个生态相反：
  #   - npm / cargo 屏蔽 major 是为了保护应用源码不被推到破坏性大版本；
  #   - action 的 major 升级通常只是换 Node 运行时，且经常是**必须**跟进的
  #     （旧 Node 运行时被弃用后，action 会直接失败或失去安全更新）。
  #     一刀切屏蔽 major 等于让这一段形同虚设。
  # 风险由 groups 收敛：所有 action 升级聚合成单个 PR，由 CI 验证后再合并。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions:
        patterns:
          - "*"
